name: Java CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Job
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java
        run: |
          java -version
          javac -version
          mvn -version

      - name: Compile Project
        run: mvn clean compile

      - name: Run Unit Tests
        run: mvn test