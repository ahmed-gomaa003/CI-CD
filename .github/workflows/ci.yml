name: Java CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Runner Information
        run: |
          echo "===== USER ====="
          whoami

          echo ""
          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo ""
          echo "===== OPERATING SYSTEM ====="
          uname -a

          echo ""
          echo "===== FILES ====="
          ls -la