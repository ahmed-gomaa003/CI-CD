name: Java CI

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      ############################################
      # Checkout
      ############################################
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      ############################################
      # Java
      ############################################
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      ############################################
      # Verify Environment
      ############################################
      - name: Verify Java & Maven
        run: |
          java -version
          javac -version
          mvn -version

      ############################################
      # Build
      ############################################
      - name: Build & Test
        run: mvn -B clean verify

      ############################################
      # SonarQube
      ############################################
      - name: SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn \
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=JavaProject \
          -Dsonar.host.url=$SONAR_HOST_URL \
          -Dsonar.login=$SONAR_TOKEN \
          -Dsonar.qualitygate.wait=true

      # ==========================================
      # Build Backend Docker Image
      # ==========================================
      - name: Build Backend Docker Image
        run: |
          docker build \
            -f back/Dockerfile \
            -t vprofile-back:${{ github.sha }} \
            .
      ############################################
      # Install Trivy
      ############################################
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release apt-transport-https

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
            gpg --dearmor | \
            sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
            sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy
      ############################################
      # Verify Trivy
      ############################################
      - name: Verify Trivy
        run: trivy --version
      ############################################
      # Scan Backend Image
      ############################################
      - name: Trivy Backend Scan
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            vprofile-back:${{ github.sha }}
      ############################################
      # Generate Backend Report
      ############################################
      - name: Generate Backend Report
        run: |
          trivy image \
            --format table \
            --output trivy-backend-report.txt \
            vprofile-back:${{ github.sha }}
      ############################################
      # Upload Backend Report
      ############################################
      - name: Upload Backend Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-report
          path: trivy-backend-report.txt
      ############################################
      # Upload WAR
      ############################################
      - name: Upload WAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WAR
          path: target/*.war

      ############################################
      # Upload JaCoCo
      ############################################
      - name: Upload JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JaCoCo
          path: target/site/jacoco/